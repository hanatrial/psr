<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Peta Sebaran Pasar Sulawesi — BCP/BSP Coverage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0f17; --surface:#121826; --card:#182036; --border:#242e46;
    --text:#e9edf5; --text2:#8d97b3; --text3:#525d78;
    --prioritas:#ff5d5d; --mds:#ffb454; --sales:#4fd1c5; --tidak:#5b6b7d;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:1fr 340px;height:100vh}
  .map-side{position:relative;overflow:hidden;background:var(--surface)}
  #mapsvg{width:100%;height:100%;display:block;cursor:grab}
  #mapsvg:active{cursor:grabbing}
  path.kab{fill:#182036;stroke:#2c3856;stroke-width:0.6;vector-effect:non-scaling-stroke}

  .info-side{border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;background:var(--surface)}
  .header{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffb454;font-weight:700;margin-bottom:6px}
  .header h1{font-size:18px;font-weight:700;letter-spacing:-0.01em;font-family:Georgia,serif}
  .header p{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.5}

  .stats-row{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border)}
  .stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 6px;text-align:center}
  .stat .num{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
  .stat .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

  .search-box{padding:14px 20px 0}
  .search-box input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:12.5px;outline:none;font-family:'DM Sans',sans-serif}
  .search-box input::placeholder{color:var(--text3)}
  .search-box input:focus{border-color:#ffb454}

  .filters{padding:16px 20px;border-bottom:1px solid var(--border)}
  .filters h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:9px;font-weight:600}
  .cat-toggle{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;margin-bottom:5px;cursor:pointer;
    transition:background .15s,border-color .15s;user-select:none;border:1px solid transparent}
  .cat-toggle:hover{background:var(--card)}
  .cat-toggle.sel{background:var(--card);border-color:currentColor}
  .cat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .cat-toggle .name{font-size:12.5px;font-weight:600;flex:1}
  .cat-toggle .count{font-size:11.5px;color:var(--text3);font-family:'DM Mono',monospace}
  .cat-toggle .radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text3);flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .cat-toggle.sel .radio{border-color:#fff}
  .cat-toggle.sel .radio::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}

  .kab-select-wrap{padding:14px 20px;border-bottom:1px solid var(--border)}
  .kab-select-wrap h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:9px;font-weight:600}
  select#kabSelect{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:12.5px;outline:none;font-family:'DM Sans',sans-serif;
    cursor:pointer;
  }
  select#kabSelect:focus{border-color:#ffb454}

  .pasar-list-wrap{padding:14px 20px;border-bottom:1px solid var(--border);flex:1;overflow-y:auto;min-height:120px}
  .pasar-list-wrap h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:9px;font-weight:600}
  #pasarSearch{
    width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:12px;outline:none;font-family:'DM Sans',sans-serif;
    margin-bottom:10px;
  }
  #pasarSearch::placeholder{color:var(--text3)}
  #pasarSearch:focus{border-color:#ffb454}
  .pasar-item{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;margin-bottom:4px;
    cursor:pointer;transition:background .15s;text-decoration:none;color:var(--text);
  }
  .pasar-item:hover{background:var(--card)}
  .pasar-item .p-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .pasar-item .p-name{font-size:12px;font-weight:500;flex:1;line-height:1.3}
  .pasar-item .p-arrow{font-size:11px;color:var(--text3)}
  .pasar-empty{font-size:11.5px;color:var(--text3);padding:8px 10px;line-height:1.6}

  .prov-list{padding:12px 20px;border-bottom:1px solid var(--border)}
  .prov-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px}
  .prov-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
  .prov-name{color:var(--text2);flex:1}
  .prov-val{color:var(--text3);font-family:'DM Mono',monospace;font-size:10.5px}

  .cat-info{
    position:absolute; top:56px; left:16px; width:300px; z-index:5;
    background:rgba(11,15,23,.85); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px 8px; backdrop-filter:blur(6px);
  }
  .cat-info h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:14px;font-weight:700}
  .cat-info-item{display:flex;gap:11px;margin-bottom:16px}
  .cat-info-item .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:5px}
  .cat-info-item .name{font-size:14px;font-weight:700;margin-bottom:3px}
  .cat-info-item .desc{font-size:12.5px;color:var(--text2);line-height:1.55}

  .hint-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .hint-panel p{font-size:11.5px;color:var(--text3);line-height:1.7}
  .hint-panel .icon{font-size:26px;margin-bottom:8px;opacity:.4}

  .detail{display:none;flex-direction:column;flex:1;overflow-y:auto}
  .detail.show{display:flex}
  .d-head{padding:14px 20px 6px}
  .d-kab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#ffb454;font-weight:700}
  .d-name{font-size:16px;font-weight:700;margin-top:3px;line-height:1.3}
  .d-cat{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;color:#0b0f17}
  .d-metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:14px 20px}
  .dm{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px}
  .dm .l{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .dm .v{font-size:16px;font-weight:700;font-family:'DM Mono',monospace}
  .d-link{display:block;margin:6px 20px 20px;text-align:center;background:#ffb454;color:#1a1006;
    padding:10px;border-radius:8px;font-size:12.5px;font-weight:700;text-decoration:none}
  .d-link:hover{filter:brightness(1.08)}

  .map-controls{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .mc-btn{width:28px;height:28px;background:rgba(18,24,38,.9);border:1px solid var(--border);border-radius:6px;
    color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .mc-btn:hover{background:var(--card);color:var(--text)}
  .map-badge{position:absolute;top:14px;left:16px;background:rgba(11,15,23,.75);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;font-size:11px;color:var(--text2);z-index:5}
  .map-badge span{color:#ffb454;font-weight:600}

  .bubble{cursor:pointer;transition:opacity .12s}
  .bubble:hover{stroke:#fff;stroke-width:1.5}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:56vh 1fr}
    .info-side{border-left:none;border-top:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="map-side">
    <div class="map-badge">Sebaran <span id="totalCount">0 Pasar</span> — 6 Provinsi Sulawesi</div>
    <div class="cat-info" id="catInfo"></div>
    <svg id="mapsvg"></svg>
    <div class="map-controls">
      <button class="mc-btn" onclick="zoomIn()">+</button>
      <button class="mc-btn" onclick="zoomOut()">−</button>
      <button class="mc-btn" onclick="resetZoom()" style="font-size:11px">↺</button>
    </div>
  </div>

  <div class="info-side">
    <div class="header">
      <div class="eyebrow">BCP / BSP · Sulawesi</div>
      <h1>Serbu Pasar Sulawesi</h1>
      <p>Toko &amp; operator ter-mapping dalam radius 500m dari tiap pasar. Klik gelembung untuk detail.</p>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="filters">
      <h3>Pilih Kategori</h3>
      <div id="catList"></div>
    </div>
    <div class="kab-select-wrap">
      <h3>Pilih Kabupaten/Kota</h3>
      <select id="kabSelect"></select>
    </div>
    <div class="pasar-list-wrap">
      <h3>Pasar (klik untuk buka Google Maps)</h3>
      <input type="text" id="pasarSearch" placeholder="Cari nama pasar…">
      <div id="pasarList"></div>
    </div>

    <div class="detail" id="detail">
      <div class="d-head">
        <div class="d-kab" id="dKab">—</div>
        <div class="d-name" id="dName">—</div>
        <div class="d-cat" id="dCat">—</div>
      </div>
      <div class="d-metrics" id="dMetrics"></div>
      <a class="d-link" id="dLink" href="#" target="_blank" rel="noopener">Buka di Google Maps ↗</a>
    </div>
  </div>
</div>

// map kab name -> provinsi (best-effort from our own KABUPATEN strings)
function guessProvinsi(kab){
  const gorontalo = ["Boalemo","Bone Bolango","Gorontalo","Gorontalo Utara","Kota Gorontalo","Pohuwato"];
  const sulbar = ["Majene","Mamasa","Mamuju","Mamuju Tengah","Pasangkayu","Polewali Mandar"];
  const sulteng = ["Banggai","Banggai Kepulauan","Banggai Laut","Buol","Donggala","Morowali","Morowali Utara",
    "Parigi Moutong","Poso","Sigi","Tojo Una-Una","Tojo Una Una","Toli-Toli","Tolitoli","Kota Palu"];
  const sultra = ["Bombana","Buton","Buton Selatan","Buton Tengah","Buton Utara","Kolaka","Kolaka Timur",
    "Kolaka Utara","Konawe","Konawe Selatan","Konawe Utara","Konawe Kepulauan","Muna","Muna Barat","Wakatobi",
    "Kota Kendari","Kota Baubau"];
  const sulut = ["Bolaang Mongondow","Bolaang Mongondow Selatan","Bolaang Mongondow Timur","Bolaang Mongondow Utara",
    "Kepulauan Sangihe","Kep. Siau Tagulandang Biaro","Kepulauan Talaud","Minahasa","Minahasa Selatan",
    "Minahasa Tenggara","Minahasa Utara","Kota Bitung","Kota Kotamobagu","Kota Manado","Kota Tomohon"];
  if(gorontalo.includes(kab)) return "Gorontalo";
  if(sulbar.includes(kab)) return "Sulawesi Barat";
  if(sulteng.includes(kab)) return "Sulawesi Tengah";
  if(sultra.includes(kab)) return "Sulawesi Tenggara";
  if(sulut.includes(kab)) return "Sulawesi Utara";
  return "Sulawesi Selatan";
}
DATA.forEach(d => d.prov = guessProvinsi(d.kab));

let activeCat = Object.keys(CATS)[0];

function fmtRp(n){
  if(n >= 1e9) return "Rp " + (n/1e9).toFixed(1) + " M";
  if(n >= 1e6) return "Rp " + (n/1e6).toFixed(1) + " Jt";
  if(n >= 1e3) return "Rp " + (n/1e3).toFixed(0) + " Rb";
  return "Rp " + Math.round(n).toLocaleString('id-ID');
}
function gmapsUrl(d){ return "https://www.google.com/maps/search/?api=1&query=" + d.lat + "," + d.lon; }
function radiusFor(omzet){ const r = Math.sqrt(Math.max(omzet,1))/380; return Math.min(Math.max(r,0.9),3.5); }

function buildStats(){
  const totalPasar = DATA.length;
  const totalToko = DATA.reduce((s,d)=>s+d.toko,0);
  const totalOperator = DATA.reduce((s,d)=>s+d.operator,0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${totalPasar}</div><div class="lbl">Pasar</div></div>
    <div class="stat"><div class="num">${totalToko.toLocaleString('id-ID')}</div><div class="lbl">Toko</div></div>
    <div class="stat"><div class="num">${totalOperator.toLocaleString('id-ID')}</div><div class="lbl">Operator</div></div>`;
  document.getElementById('totalCount').textContent = totalPasar + " Pasar";
}

function buildFilters(){
  const el = document.getElementById('catList'); el.innerHTML='';
  Object.keys(CATS).forEach(cat=>{
    const count = DATA.filter(d=>d.kategori===cat).length;
    const row = document.createElement('div');
    row.className='cat-toggle' + (cat===activeCat ? ' sel' : '');
    row.dataset.cat=cat;
    row.style.color = CATS[cat];
    row.innerHTML = `<span class="radio"></span>
      <span class="cat-dot" style="background:${CATS[cat]}"></span>
      <span class="name" style="color:var(--text)">${cat}</span><span class="count">${count}</span>`;
    row.addEventListener('click', ()=>{
      activeCat = cat;
      activeKab = 'Semua';
      buildFilters();
      buildKabSelect();
      buildPasarList();
      renderBubbles();
    });
    el.appendChild(row);
  });
}

function buildKabSelect(){
  const sel = document.getElementById('kabSelect');
  const kabs = [...new Set(DATA.filter(d=>d.kategori===activeCat).map(d=>d.kab))].sort();
  sel.innerHTML = `<option value="Semua">Semua Kabupaten/Kota (${kabs.length})</option>` +
    kabs.map(k => `<option value="${k}">${k}</option>`).join('');
  sel.value = activeKab;
  sel.onchange = () => {
    activeKab = sel.value;
    buildPasarList();
    renderBubbles();
  };
}

function buildPasarList(){
  const wrap = document.getElementById('pasarList');
  const term = (document.getElementById('pasarSearch').value || '').toLowerCase();
  let list = DATA.filter(d => d.kategori===activeCat && (activeKab==='Semua' || d.kab===activeKab));
  if(term) list = list.filter(d => d.pasar.toLowerCase().includes(term) || d.kab.toLowerCase().includes(term));
  list = list.sort((a,b)=> b.omzet_total - a.omzet_total);
  if(!list.length){ wrap.innerHTML = `<div class="pasar-empty">Tidak ada pasar untuk kombinasi ini.</div>`; return; }
  wrap.innerHTML = list.map(d => `
    <div class="pasar-item" data-kab="${d.kab}" data-pasar="${d.pasar.replace(/"/g,'&quot;')}">
      <span class="p-dot" style="background:${CATS[d.kategori]}"></span>
      <span class="p-name">${d.pasar}${activeKab==='Semua' ? ' <span style=\"color:var(--text3);font-weight:400\">— '+d.kab+'</span>' : ''}</span>
      <span class="p-arrow">→</span>
    </div>`).join('');
  wrap.querySelectorAll('.pasar-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const d = DATA.find(x => x.kab===item.dataset.kab && x.pasar===item.dataset.pasar);
      if(d){ showDetail(d); flyToPoint(d); }
    });
  });
}

const CAT_DESC = {
  "Prioritas Tinggi": "Pasar besar dengan omzet tinggi, atau toko &amp; operator sama-sama ramai (≥5 keduanya), atau demand tinggi (operator jauh lebih banyak dari toko). Layak jadi fokus kunjungan &amp; monitoring rutin.",
  "Recheck Coverage MDS": "Toko sudah tercatat (kadang omzetnya besar) tapi titik operator MDS di pasar ini minim atau nol. Perlu dicek ulang — kemungkinan data operator belum lengkap ter-input.",
  "Recheck Coverage Sales": "Operator MDS sudah ada di pasar ini, tapi toko-nya nol. Perlu dicek apakah toko memang belum ke-input atau memang belum ada toko formal.",
  "Tidak Prioritas": "Pasar kecil dengan toko &amp; operator sedikit dan omzet rendah/nol. Tidak ada sinyal mencolok yang perlu ditindaklanjuti khusus saat ini."
};

function buildCatInfo(){
  document.getElementById('catInfo').innerHTML = `<h3>Arti Kategori</h3>` +
    Object.keys(CATS).map(cat => `
      <div class="cat-info-item">
        <span class="dot" style="background:${CATS[cat]}"></span>
        <div>
          <div class="name">${cat}</div>
          <div class="desc">${CAT_DESC[cat]}</div>
        </div>
      </div>`).join('');
}

function flyToPoint(d){
  const wrap = document.querySelector('.map-side');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const [px, py] = projection([d.lon, d.lat]);
  const scale = 5;
  const transform = d3.zoomIdentity
    .translate(w/2, h/2)
    .scale(scale)
    .translate(-px, -py);
  svg.transition().duration(650).call(zoomBehavior.transform, transform);

  bubbleG.selectAll('circle.bubble')
    .attr('stroke', b => (b.kab===d.kab && b.pasar===d.pasar) ? '#fff' : '#0b0f17')
    .attr('stroke-width', b => (b.kab===d.kab && b.pasar===d.pasar) ? 2.5 : 1);
}

function showDetail(d){
  const det = document.getElementById('detail');
  det.classList.add('show');
  document.getElementById('dKab').textContent = d.kab;
  document.getElementById('dName').textContent = d.pasar;
  const catEl = document.getElementById('dCat');
  catEl.textContent = d.kategori;
  catEl.style.background = CATS[d.kategori];
  document.getElementById('dMetrics').innerHTML = `
    <div class="dm"><div class="l">Toko</div><div class="v">${d.toko}</div></div>
    <div class="dm"><div class="l">Operator</div><div class="v">${d.operator}</div></div>`;
  document.getElementById('dLink').href = gmapsUrl(d);
}

function renderBubbles(){
  const filtered = DATA.filter(d => d.kategori===activeCat && (activeKab==='Semua' || d.kab===activeKab));

  const sel = bubbleG.selectAll('circle.bubble').data(filtered, d => d.kab + '|' + d.pasar);
  sel.exit().remove();
  const enter = sel.enter().append('circle')
    .attr('class','bubble')
    .attr('stroke', '#0b0f17')
    .attr('stroke-width', 1)
    .on('click', (ev,d)=>{ ev.stopPropagation(); showDetail(d); });

  enter.merge(sel)
    .attr('cx', d => projection([d.lon, d.lat])[0])
    .attr('cy', d => projection([d.lon, d.lat])[1])
    .attr('r', d => radiusFor(d.omzet_total))
    .attr('fill', d => CATS[d.kategori])
    .attr('fill-opacity', 0.68);
}

function initMap(){
  svg = d3.select('#mapsvg');
  const wrap = document.querySelector('.map-side');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${w} ${h}`);

  g = svg.append('g');
  mapG = g.append('g').attr('class','map-g');
  bubbleG = g.append('g').attr('class','bubble-g');

  const geo = topojson.feature(TOPO, TOPO.objects.kab);
  projection = d3.geoMercator().fitSize([w, h], geo);
  const path = d3.geoPath().projection(projection);

  mapG.selectAll('path.kab')
    .data(geo.features)
    .enter().append('path')
    .attr('class','kab')
    .attr('d', path);

  zoomBehavior = d3.zoom().scaleExtent([1, 14]).on('zoom', (ev) => {
    g.attr('transform', ev.transform);
  });
  svg.call(zoomBehavior);

  renderBubbles();
}

function zoomIn(){ svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.6); }
function zoomOut(){ svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.63); }
function resetZoom(){ svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity); }

initMap();
