<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>List Sekolah</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  :root{
    --cream:#fdf6e8; --card:#ffffff; --maroon:#7a2e2e; --maroon2:#9a3b3b;
    --navy:#1f3a5f; --gold:#e3a008; --text:#3a2e22; --muted:#8a7a68;
    --border:#ecdfc8; --green:#2f7a4f; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--cream);color:var(--text);font-family:'Poppins',sans-serif}
  .wrap{max-width:600px;margin:0 auto;padding:0 0 60px}

  .hero{
    background:linear-gradient(135deg, var(--maroon), var(--navy));
    padding:34px 20px 50px;color:#fff;position:relative;overflow:hidden;
    border-radius:0 0 28px 28px;
  }
  .hero::after{ content:"🏫"; position:absolute; right:-10px; bottom:-30px; font-size:140px; opacity:.15; }
  .hero h1{font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px}
  .hero .sub{font-size:13px;opacity:.85;margin-top:6px;max-width:380px;line-height:1.5}

  .content{padding:0 18px;margin-top:-26px;position:relative;z-index:2}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:6px;padding-left:2px}
  select, input[type="text"]{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);
    background:var(--card);color:var(--text);font-size:14.5px;outline:none;font-family:'Poppins',sans-serif;
    box-shadow:0 4px 14px rgba(122,46,46,.07);
  }
  select:focus, input[type="text"]:focus{border-color:var(--gold)}

  .count{font-size:12px;color:var(--muted);margin:14px 2px 8px;font-weight:600}
  .list{display:flex;flex-direction:column;gap:9px}
  .item{
    background:var(--card);border:1.5px solid var(--border);border-radius:14px;
    padding:13px 15px;cursor:pointer;font-size:14px;font-weight:500;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    transition:border-color .12s, transform .12s;
  }
  .item:hover{border-color:var(--gold); transform:translateY(-1px)}
  .item.yes{border-color:var(--green); background:#f3faf5}
  .item.no{border-color:#e6b4ad; background:#fdf4f2}
  .item .name{display:flex;align-items:center;gap:9px}
  .item .name::before{content:"🎒";font-size:15px}
  .item .tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .pill{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-radius:20px;padding:3px 9px;white-space:nowrap;font-weight:700}
  .pill.kab{color:var(--maroon2);background:rgba(122,46,46,.08);border:1px solid rgba(122,46,46,.18)}
  .pill.yes{color:#fff;background:var(--green)}
  .pill.no{color:#fff;background:var(--red)}
  .empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}

  .overlay{position:fixed;inset:0;background:rgba(40,25,15,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
  .sheet .q{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .sheet .sn{font-size:17px;font-weight:800;margin:6px 0 2px;color:var(--navy)}
  .sheet .sk{font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .sheet .big{font-size:20px;font-weight:800;text-align:center;margin-bottom:14px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;font-family:'Poppins',sans-serif}
  .btn.yes{background:var(--green)}
  .btn.no{background:var(--red)}
  .btn:disabled{opacity:.6;cursor:wait}
  .cancel{width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;background:#f1e8d8;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;font-family:'Poppins',sans-serif}
  .err{color:var(--red);font-size:12.5px;text-align:center;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🏫 List Sekolah</h1>
    <div class="sub">Sekolah yang belum masuk, per kabupaten. Ketuk sekolah untuk catat sudah divisit atau belum.</div>
  </div>

  <div class="content">
    <div class="field">
      <label for="filterKab">Kabupaten</label>
      <select id="filterKab">
        <option value="">Semua Kabupaten</option>
      </select>
    </div>
    <div class="field">
      <label for="filterStatus">Status Visit</label>
      <select id="filterStatus">
        <option value="">Semua</option>
        <option value="yes">Sudah divisit</option>
        <option value="not">Belum divisit</option>
      </select>
    </div>
    <div class="field">
      <label for="searchBox">Cari Sekolah</label>
      <input type="text" id="searchBox" placeholder="Ketik nama sekolah...">
    </div>

    <div class="count" id="resultCount"></div>
    <div class="list" id="resultList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="q">Sudah divisit?</div>
    <div class="sn" id="sheetName"></div>
    <div class="sk" id="sheetKab"></div>
    <div class="btns">
      <button type="button" class="btn yes" id="btnYes">Ya</button>
      <button type="button" class="btn no" id="btnNo">Tidak</button>
    </div>
    <button type="button" class="cancel" id="btnCancel">Batal</button>
    <div class="err" id="sheetErr"></div>
  </div>
</div>

  const firebaseConfig = {
    apiKey: "AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs",
    authDomain: "mds-sulawesi.firebaseapp.com",
    projectId: "mds-sulawesi",
    storageBucket: "mds-sulawesi.firebasestorage.app",
    messagingSenderId: "511949021685",
    appId: "1:511949021685:web:bc32007af0555449e7c0bc"
  };

  // satu dokumen school_visits/status berisi map { id sekolah: true|false }, supaya cukup 1 read per buka halaman
  const CLOUD = { ready: false, write: null };
  window.CLOUD = CLOUD;
  let visits = {};

  function hashId(s){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i = 0; i < s.length; i++){
      const ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 'h' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  DATA.forEach(r => { r.id = hashId(r.kab + '|' + r.sek); });

  async function initCloud(){
    try{
      const app = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const db = fs.getFirestore(app.initializeApp(firebaseConfig));
      const ref = fs.doc(db, 'school_visits', 'status');
      fs.onSnapshot(ref, snap => {
        visits = (snap.exists() && snap.data().v) || {};
        render();
      }, () => {});
      CLOUD.write = (id, val) => fs.setDoc(ref, { v: { [id]: val }, updated_at: fs.serverTimestamp() }, { merge: true });
      CLOUD.ready = true;
    }catch(e){ CLOUD.ready = false; }
  }

  const filterKab = document.getElementById('filterKab');
  const filterStatus = document.getElementById('filterStatus');
  const searchBox = document.getElementById('searchBox');
  const resultList = document.getElementById('resultList');
  const resultCount = document.getElementById('resultCount');
  const overlay = document.getElementById('overlay');
  const sheetName = document.getElementById('sheetName');
  const sheetKab = document.getElementById('sheetKab');
  const sheetErr = document.getElementById('sheetErr');
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');

  const counts = {};
  DATA.forEach(r => { const k = r.prov + '|' + r.kab; counts[k] = (counts[k] || 0) + 1; });
  [...new Set(DATA.map(r => r.prov))].sort().forEach(p => {
    const grp = document.createElement('optgroup');
    grp.label = p;
    [...new Set(DATA.filter(r => r.prov === p).map(r => r.kab))].sort().forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = k + ' (' + counts[p + '|' + k] + ')';
      grp.appendChild(opt);
    });
    filterKab.appendChild(grp);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let currentFiltered = [];

  function render(){
    const kab = filterKab.value;
    const st = filterStatus.value;
    const q = searchBox.value.trim().toLowerCase();
    currentFiltered = DATA.filter(r =>
      (!kab || r.kab === kab) &&
      (!q || r.sek.toLowerCase().includes(q)) &&
      (!st || (st === 'yes' ? visits[r.id] === true : visits[r.id] !== true))
    );
    const done = currentFiltered.filter(r => visits[r.id] === true).length;
    resultCount.textContent = currentFiltered.length + ' sekolah · ' + done + ' sudah divisit';

    if(currentFiltered.length === 0){
      resultList.innerHTML = '<div class="empty">Tidak ada sekolah yang cocok.</div>';
      return;
    }
    const shown = currentFiltered.slice(0, 200);
    resultList.innerHTML = shown.map((r, i) => {
      const v = visits[r.id];
      const cls = v === true ? ' yes' : (v === false ? ' no' : '');
      const badge = v === true ? '<span class="pill yes">Sudah</span>' : (v === false ? '<span class="pill no">Belum</span>' : '');
      return '<div class="item' + cls + '" data-idx="' + i + '">' +
        '<span class="name">' + escapeHtml(r.sek) + '</span>' +
        '<span class="tags"><span class="pill kab">' + escapeHtml(r.kab) + '</span>' + badge + '</span>' +
      '</div>';
    }).join('');
    if(currentFiltered.length > 200){
      resultList.innerHTML += '<div class="empty">...dan ' + (currentFiltered.length - 200) + ' lainnya. Perjelas pencarian untuk mempersempit.</div>';
    }
  }

  let activeRow = null;

  function openSheet(r){
    activeRow = r;
    sheetName.textContent = r.sek;
    sheetKab.textContent = r.kab;
    sheetErr.textContent = '';
    btnYes.disabled = btnNo.disabled = false;
    overlay.classList.add('show');
  }
  function closeSheet(){ overlay.classList.remove('show'); activeRow = null; }

  async function answer(val){
    if(!activeRow) return;
    if(!CLOUD.ready || !CLOUD.write){ sheetErr.textContent = 'Belum tersambung ke server. Cek koneksi lalu coba lagi.'; return; }
    btnYes.disabled = btnNo.disabled = true;
    try{
      await CLOUD.write(activeRow.id, val);
      visits[activeRow.id] = val;
      closeSheet();
      render();
    }catch(e){
      sheetErr.textContent = 'Gagal menyimpan. Coba lagi.';
      btnYes.disabled = btnNo.disabled = false;
    }
  }

  resultList.addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if(!item) return;
    const r = currentFiltered[parseInt(item.getAttribute('data-idx'), 10)];
    if(r) openSheet(r);
  });
  btnYes.addEventListener('click', () => answer(true));
  btnNo.addEventListener('click', () => answer(false));
  document.getElementById('btnCancel').addEventListener('click', closeSheet);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeSheet(); });

  filterKab.addEventListener('change', render);
  filterStatus.addEventListener('change', render);
  searchBox.addEventListener('input', render);
  render();
  initCloud();
</script>
