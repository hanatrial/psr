<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>List Sekolah</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  :root{
    --cream:#fdf6e8; --card:#ffffff; --maroon:#7a2e2e; --maroon2:#9a3b3b;
    --navy:#1f3a5f; --gold:#e3a008; --text:#3a2e22; --muted:#8a7a68;
    --border:#ecdfc8; --green:#2f7a4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--cream);color:var(--text);font-family:'Poppins',sans-serif}
  .wrap{max-width:600px;margin:0 auto;padding:0 0 60px}

  .hero{
    background:linear-gradient(135deg, var(--maroon), var(--navy));
    padding:34px 20px 50px;color:#fff;position:relative;overflow:hidden;
    border-radius:0 0 28px 28px;
  }
  .hero::after{
    content:"🏫"; position:absolute; right:-10px; bottom:-30px; font-size:140px; opacity:.15;
  }
  .hero h1{font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px}
  .hero .sub{font-size:13px;opacity:.85;margin-top:6px;max-width:380px;line-height:1.5}

  .content{padding:0 18px;margin-top:-26px;position:relative;z-index:2}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:6px;padding-left:2px}
  select, input[type="text"]{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);
    background:var(--card);color:var(--text);font-size:14.5px;outline:none;font-family:'Poppins',sans-serif;
    box-shadow:0 4px 14px rgba(122,46,46,.07);
  }
  select:focus, input[type="text"]:focus{border-color:var(--gold)}

  .count{font-size:12px;color:var(--muted);margin:14px 2px 8px;font-weight:600}
  .list{display:flex;flex-direction:column;gap:9px}
  .item{
    background:var(--card);border:1.5px solid var(--border);border-radius:14px;
    padding:13px 15px;cursor:pointer;font-size:14px;font-weight:500;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    transition:border-color .12s, transform .12s;
  }
  .item:hover{border-color:var(--gold); transform:translateY(-1px)}
  .item.selected{border-color:var(--green); background:#f3faf5}
  .item .name{display:flex;align-items:center;gap:9px}
  .item .name::before{content:"🎒";font-size:15px}
  .item .kab{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--maroon2);
    background:rgba(122,46,46,.08);border:1px solid rgba(122,46,46,.18);border-radius:20px;
    padding:3px 9px;white-space:nowrap;font-weight:700}
  .empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}

  .picked{
    margin-top:14px;padding:16px;border-radius:16px;border:1.5px solid var(--green);
    background:#f0faf3;font-size:14px;display:none;align-items:center;gap:10px;
  }
  .picked.show{display:flex}
  .picked .icon{font-size:24px}
  .picked .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--green);font-weight:700;margin-bottom:2px}
  .picked .name{font-weight:700;font-size:14.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🏫 List Sekolah</h1>
    <div class="sub">Pilih kabupaten (opsional) lalu cari dan ketuk sekolah yang dimaksud.</div>
  </div>

  <div class="content">
    <div class="field">
      <label for="filterKab">Kabupaten</label>
      <select id="filterKab">
        <option value="">Semua Kabupaten</option>
      </select>
    </div>
    <div class="field">
      <label for="searchBox">Cari Sekolah</label>
      <input type="text" id="searchBox" placeholder="Ketik nama sekolah...">
    </div>

    <div class="picked" id="pickedBox">
      <div class="icon">✅</div>
      <div>
        <div class="lbl">Terpilih</div>
        <div class="name" id="pickedText"></div>
      </div>
    </div>

    <div class="count" id="resultCount"></div>
    <div class="list" id="resultList"></div>
  </div>
</div>

  const filterKab = document.getElementById('filterKab');
  const searchBox = document.getElementById('searchBox');
  const resultList = document.getElementById('resultList');
  const resultCount = document.getElementById('resultCount');
  const pickedBox = document.getElementById('pickedBox');
  const pickedText = document.getElementById('pickedText');

  const kabupatens = [...new Set(DATA.map(r => r.kab))].sort();
  kabupatens.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = k;
    filterKab.appendChild(opt);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let currentFiltered = [];

  function render(){
    const kab = filterKab.value;
    const q = searchBox.value.trim().toLowerCase();
    currentFiltered = DATA.filter(r =>
      (!kab || r.kab === kab) && (!q || r.sek.toLowerCase().includes(q))
    );
    resultCount.textContent = currentFiltered.length + ' sekolah ditemukan';
    if(currentFiltered.length === 0){
      resultList.innerHTML = '<div class="empty">Tidak ada sekolah yang cocok.</div>';
      return;
    }
    const shown = currentFiltered.slice(0, 200);
    resultList.innerHTML = shown.map((r, i) =>
      '<div class="item" data-idx="' + i + '">' +
        '<span class="name">' + escapeHtml(r.sek) + '</span>' +
        '<span class="kab">' + escapeHtml(r.kab) + '</span>' +
      '</div>'
    ).join('');
    if(currentFiltered.length > 200){
      resultList.innerHTML += '<div class="empty">...dan ' + (currentFiltered.length - 200) + ' lainnya. Perjelas pencarian untuk mempersempit.</div>';
    }
  }

  resultList.addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if(!item) return;
    const idx = parseInt(item.getAttribute('data-idx'), 10);
    const r = currentFiltered[idx];
    if(!r) return;
    document.querySelectorAll('.item.selected').forEach(el => el.classList.remove('selected'));
    item.classList.add('selected');
    pickedText.textContent = r.sek + ' (' + r.kab + ')';
    pickedBox.classList.add('show');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  filterKab.addEventListener('change', render);
  searchBox.addEventListener('input', render);
  render();
</script>
