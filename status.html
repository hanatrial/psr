<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Status Foto — Serbu Pasar Sulawesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0f17; --surface:#121826; --card:#182036; --border:#242e46;
    --text:#e9edf5; --text2:#8d97b3; --text3:#525d78;
    --accent:#ffb454; --ok:#4fd1c5; --err:#ff5d5d;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:36px 20px 80px}

  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  h1{font-size:20px;font-weight:700;font-family:Georgia,serif;margin-bottom:6px}
  .sub{font-size:12.5px;color:var(--text3);line-height:1.6;margin-bottom:22px}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px}
  .list-head h2{font-size:14px;font-family:Georgia,serif}
  .list-head .count{font-size:11.5px;color:var(--text3);font-family:'DM Mono',monospace}
  .list-filter{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .list-filter > div{flex:1;min-width:150px}
  .list-filter label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);
    font-weight:600;margin:0 0 5px;white-space:nowrap}
  .list-filter select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:12.5px;outline:none}

  .totals-bar{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
  .totals-bar .t{flex:1;min-width:90px;background:var(--card);padding:11px 14px}
  .totals-bar .t .n{font-size:17px;font-weight:700;font-family:'DM Mono',monospace}
  .totals-bar .t .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-top:2px}
  .totals-bar .t.ok .n{color:var(--ok)}
  .totals-bar .t.pending .n{color:var(--accent)}

  .pdf-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .pdf-btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);
    color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;transition:border-color .15s}
  .pdf-btn:hover{border-color:var(--accent)}
  .pdf-btn:disabled{opacity:.5;cursor:not-allowed}
  .pdf-status{font-size:11.5px;color:var(--text3)}

  .only-missing{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);margin-bottom:14px}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
  table.report-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.report-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text3);padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);
    white-space:nowrap}
  table.report-table td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.report-table tr:last-child td{border-bottom:none}
  table.report-table tr:hover td{background:rgba(255,255,255,.02)}
  .entry-area{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--accent);background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.3);
    border-radius:20px;padding:2px 8px}
  .chk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:6px;font-size:13px;font-weight:700}
  .chk.yes{background:rgba(79,209,197,.15);color:var(--ok);border:1px solid rgba(79,209,197,.4)}
  .chk.no{background:rgba(255,93,93,.1);color:var(--err);border:1px solid rgba(255,93,93,.3)}
  .empty-list{font-size:12px;color:var(--text3);text-align:center;padding:24px;white-space:normal}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Status Tim</div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <h1>Status Foto</h1>
    <a href="tuset.html" style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:700">← Ke halaman Input</a>
  </div>
  <div class="sub">Halaman ini cuma memuat data ringan (boolean sudah/belum), tanpa foto — jadi cepat dibuka. PDF diunduh dengan mengambil foto satu-satu, hanya untuk kedai yang lengkap sesuai filter.</div>

  <div class="list-head">
    <h2>Rekap Kedai</h2>
    <span class="count" id="entryCount">—</span>
  </div>
  <div class="list-filter">
    <div>
      <label for="filterArea">Filter Area</label>
      <select id="filterArea">
        <option value="">Semua Area</option>
        <option value="Makassar">Makassar</option>
        <option value="Gorontalo">Gorontalo</option>
      </select>
    </div>
    <div>
      <label for="filterMds">Filter MDS</label>
      <select id="filterMds">
        <option value="">Semua MDS</option>
      </select>
    </div>
  </div>
  <div class="totals-bar" id="totalsBar"></div>
  <label class="only-missing"><input type="checkbox" id="onlyMissing"> Tampilkan yang belum lengkap saja</label>
  <div class="pdf-bar">
    <button type="button" class="pdf-btn" id="pdfBtn">📄 Download PDF (kedai lengkap)</button>
    <span class="pdf-status" id="pdfStatus"></span>
  </div>
  <div class="table-wrap">
    <table class="report-table">
      <thead>
        <tr>
          <th>Nama MDS</th>
          <th>Nama Kedai</th>
          <th>Area</th>
          <th>KTP</th>
          <th>Foto</th>
          <th>Display</th>
        </tr>
      </thead>
      <tbody id="entryList"><tr><td colspan="6" class="empty-list">Memuat…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs",
    authDomain: "mds-sulawesi.firebaseapp.com",
    projectId: "mds-sulawesi",
    storageBucket: "mds-sulawesi.firebasestorage.app",
    messagingSenderId: "511949021685",
    appId: "1:511949021685:web:bc32007af0555449e7c0bc"
  };

  // MASTER_LIST + KTP_EXEMPT sengaja disalin dari tuset.html (situs statis, tanpa
  // backend bersama) — kalau daftar kedai berubah di tuset.html, salin ulang ke sini.
  const MASTER_LIST = [
    { area: "Makassar", mds: "Andi Iswan Tenri", kedai: "Mks - kedai tiga putra" },
    { area: "Makassar", mds: "Andi Iswan Tenri", kedai: "Mks - kedai resky" },
    { area: "Makassar", mds: "Andi Muh. Nurfikrahturrahman", kedai: "Mks - kedai tiga dara manis" },
    { area: "Makassar", mds: "Hasrar", kedai: "BLK kedai amirah" },
    { area: "Makassar", mds: "SYAFRI", kedai: "MKS-KEDAI CAPPA" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "MKS-KEDAI HAURA" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "KEDAI GIBRAN TANRALILI" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "KEDAI JSR" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "Kedai borneo" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "Kedai khaira" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "Mks-Kantin SDI Bakung 1" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "Mks- Menu RR maros" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "MKS-KANTIN VHIYA" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "KANTIN SALSA" },
    { area: "Makassar", mds: "Rahmat Maros", kedai: "Mks-Es teh jumbo bung" },
    { area: "Makassar", mds: "Sulfiana Rusdy", kedai: "KANTIN IBU WATI" },
    { area: "Makassar", mds: "Sulfiana Rusdy", kedai: "Kantin Merah Amanah Pgkp" },
    { area: "Makassar", mds: "ANDI MAPANYUKKI", kedai: "Kedai misbah" },
    { area: "Makassar", mds: "ANDI MAPANYUKKI", kedai: "GOWA-KANTIN HAJI LINRA" },
    { area: "Makassar", mds: "ANDI MAPANYUKKI", kedai: "Mks-kedai nadhif" },
  ];
  const KTP_EXEMPT = new Set(["Mks - kedai kartini makmur","Mks - arb","Mks-kedai faizah","Wm arsy arsya","Mks-kedai pinky","Mks - the aling drink","Mks - gorengan suka-suka","Mks-Wm hilya","Mks-kedai hasni","Mks - kedai tiga putra","GOWA-KEDAI BUNDA","Mks - kedai resky","Mks - boba cincau","Mks - kedai syaka","Mks-kedai aa","Mks - jajanan receh","Mks - kedai bucin","Mks kedai wahyu","Mks - sarabba gorengan arrahman","Mks kedai reski","Mks - kedai tiga dara manis","Mks - Kantin SDN Kakatua","Mks - kantin azzahrah","Mks - kantin muli UMI","Mks - Kedai Zahra","Mks - kedai es 86","Kedai drink rumahan","Mks warung bakso mas daduk","Mks - kedai bhelenk","Mks - kantin ungu","Mks - kedai hasmawati","Kedai aneka nutrisari","Mks - bakso mas unang","MKS-Kedai Es Cell","Mks - kedai Cece","Kedai nada","Mks-Kantin Kuning SDN Cedrawasih","Mks- warung ibu eni","Mks kedai aqila","Mks-Warung Khairunnisa","Mks - kedai alfian","Kantin mama yusuf","Warung nasi teras","Mks kantin 06","Kebab aqila","Kedai aiu","Rombong dg Naba","Mks - kedai perempatan","Mks - kedai appi","Mks - kedai silva","Kantin tante say","Kedai bonle","Kedai tini","Mks - kedai amina","Mks - okm bibi fizah","MKS-KEDAI CAPPA","KEDAI HAMDALAH CARENGKI","SUKI SUKA","KEDAI GIBRAN TANRALILI","KEDAI JSR","Kedai borneo","Kedai khaira","Mks-Kantin SDI Bakung 1","Mks- Menu RR maros","KEDAY AYDAN","KEDAI PURBA LEANG LEANG","Mks-Lestari Drink 2","MKS-KANTIN VHIYA","KEDAI ABY","LAPO KOPI","KANTIN SALSA","Mks-Es teh jumbo bung","BLK- Kantin Tanta Ida SMA 1 Bulukumba","BLK- KEDAI KUNING","Snj_kedai aryul","kedai doyan jajan snj","Kantin 12 (SMPN 10 BULUKUMBA)","kantin sehat smp 5 sinjai","BLK ROMANTICA CAFE","kedai inha snj","KEDAI ASMARANI","BTG-KANTIN FITA","BLK - KEDAI ADDAR","BLK-KEDAI AYU","Es teh poci ke'nang","KANTIN IBU WATI","Kedai Gerobak kuning kampala","Kedai Teh Poci Syarif","Kedai Farel","Kantin Merah Amanah Pgkp","Kedai 77 Kopi Kita","CRUNCHY FOODS","RUMAH MAKAN JAWA TIMUR BU AYU","BTG- Kedai CC UCI","Kedai dapur ghina","Wrg mkn psm junior","Blk KEDAI GILANG","Snj_kedai pink lapnas","BTG- Kedai tasty trial","Dg so'na","BTG-RM MAS JOKO","SNJ - Kedai putri tunggal","kedai berkah snj","BTG- warung bakso goyang lidah","Mks-Kantin mama indah","WR BAKSO MBA ERNI","Snj_kedai dini","BLK kedai amirah","SNJ - Kedai ridha","TKLR-WARUNG MAS IDOLAKU","BTG-KEDAI SUCI sentral","GOWA-WARUNG SRI","Snj BAKSO FAZA","BTG- Kedai Tanpa Boss","GOWA-KANTIN ABDULLAH","Mks-kedai hafiz","GOWA-KEDAI NURUL YAKIN","Mks-kantin cemara","Kedai misbah","Mks-kedai amman'","Mks-kedai malika","GOWA-KEDAI SINAR","GOWA-KANTIN HAJI LINRA","Mks - kedai ibu murni (dpn sdn sumanna)","GOWA-KEDAI 3A","GOWA-KEDAI ANNISA","Dapoer mammy","Mks-kedai nadhif"]);

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("GANTI");
  const entryList = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');
  const filterArea = document.getElementById('filterArea');
  const filterMds = document.getElementById('filterMds');
  const onlyMissing = document.getElementById('onlyMissing');
  const totalsBar = document.getElementById('totalsBar');
  const pdfBtn = document.getElementById('pdfBtn');
  const pdfStatus = document.getElementById('pdfStatus');

  function uniqueSorted(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b)); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slugify(s){
    return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
  }
  function reportDocId(area, mds, kedai){
    return `${slugify(area)}__${slugify(mds)}__${slugify(kedai)}`;
  }

  function updateMdsFilterOptions(){
    const area = filterArea.value;
    const mdsOptions = uniqueSorted(MASTER_LIST.filter(r => !area || r.area === area).map(r => r.mds));
    const current = filterMds.value;
    filterMds.innerHTML = '<option value="">Semua MDS</option>' +
      mdsOptions.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
    if(mdsOptions.includes(current)) filterMds.value = current;
  }

  let lastDocs = [];

  function renderEntries(){
    const areaFilter = filterArea.value;
    const mdsFilter = filterMds.value;
    const missingOnly = onlyMissing.checked;

    const statusMap = new Map();
    lastDocs.forEach(d => statusMap.set(d.mds + '||' + d.kedai, d));

    let rows = MASTER_LIST.filter(r =>
      (!areaFilter || r.area === areaFilter) && (!mdsFilter || r.mds === mdsFilter)
    );

    const withKtp = rows.filter(r => statusMap.get(r.mds + '||' + r.kedai)?.ktp).length;
    const withFoto = rows.filter(r => statusMap.get(r.mds + '||' + r.kedai)?.peny).length;
    const withDisplay = rows.filter(r => statusMap.get(r.mds + '||' + r.kedai)?.disp).length;
    const isLengkap = (r) => {
      const d = statusMap.get(r.mds + '||' + r.kedai);
      return !!(d?.peny && d?.disp && (d?.ktp || KTP_EXEMPT.has(r.kedai)));
    };
    const lengkapCount = rows.filter(isLengkap).length;

    entryCount.textContent = rows.length + ' kedai';
    totalsBar.innerHTML = `
      <div class="t"><div class="n">${rows.length}</div><div class="l">Total Kedai</div></div>
      <div class="t"><div class="n">${withKtp}</div><div class="l">KTP Masuk</div></div>
      <div class="t"><div class="n">${withFoto}</div><div class="l">Foto Masuk</div></div>
      <div class="t"><div class="n">${withDisplay}</div><div class="l">Display Masuk</div></div>
      <div class="t ok"><div class="n">${lengkapCount} / ${rows.length}</div><div class="l">Lengkap</div></div>
      <div class="t pending"><div class="n">${rows.length - lengkapCount}</div><div class="l">Belum Lengkap</div></div>`;

    if(missingOnly) rows = rows.filter(r => !isLengkap(r));

    if(!rows.length){
      entryList.innerHTML = '<tr><td colspan="6" class="empty-list">Tidak ada kedai untuk filter ini.</td></tr>';
      return;
    }
    entryList.innerHTML = rows.map(r => {
      const d = statusMap.get(r.mds + '||' + r.kedai);
      const ktpOk = d?.ktp || KTP_EXEMPT.has(r.kedai);
      return `
      <tr>
        <td>${escapeHtml(r.mds)}</td>
        <td>${escapeHtml(r.kedai)}</td>
        <td><span class="entry-area">${escapeHtml(r.area)}</span></td>
        <td>${ktpOk ? '<span class="chk yes">✓</span>' : '<span class="chk no">✕</span>'}</td>
        <td>${d?.peny ? '<span class="chk yes">✓</span>' : '<span class="chk no">✕</span>'}</td>
        <td>${d?.disp ? '<span class="chk yes">✓</span>' : '<span class="chk no">✕</span>'}</td>
      </tr>`;
    }).join('');
  }
  filterArea.addEventListener('change', () => { updateMdsFilterOptions(); renderEntries(); });
  filterMds.addEventListener('change', renderEntries);
  onlyMissing.addEventListener('change', renderEntries);
  updateMdsFilterOptions();

  if(!isConfigured){
    entryList.innerHTML = '<tr><td colspan="6" class="empty-list">Firebase belum dikonfigurasi.</td></tr>';
    pdfBtn.disabled = true;
  } else {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const statusRef = collection(db, "report_status");
    const reportsRef = collection(db, "reports");

    // Cuma dengerin collection ringan (boolean doang, tanpa base64 foto) —
    // makanya halaman ini tetap cepat walau kedai-nya ratusan.
    onSnapshot(statusRef, (snap) => {
      lastDocs = snap.docs.map(d => d.data());
      renderEntries();
    }, (err) => {
      entryList.innerHTML = '<tr><td colspan="6" class="empty-list">Gagal memuat data: ' + escapeHtml(err.message) + '</td></tr>';
    });

    // ---- Export PDF: foto BARU diambil satu-satu dari koleksi "reports" (yang berat),
    // dan cuma untuk kedai yang lengkap sesuai filter saat ini — bukan sekaligus semua.
    function loadImage(url){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }
    function drawImageFit(pdfDoc, img, x, y, boxW, boxH){
      const ratio = Math.min(boxW / img.width, boxH / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      const dx = x + (boxW - w) / 2, dy = y + (boxH - h) / 2;
      pdfDoc.addImage(img, 'JPEG', dx, dy, w, h);
    }

    pdfBtn.addEventListener('click', async () => {
      const inputPw = window.prompt('Masukkan password untuk download PDF:');
      if(inputPw === null) return;
      if(inputPw !== 'pdf'){
        pdfStatus.textContent = 'Password salah.';
        setTimeout(() => pdfStatus.textContent = '', 3000);
        return;
      }

      const areaFilter = filterArea.value;
      const mdsFilter = filterMds.value;
      const statusMap = new Map();
      lastDocs.forEach(d => statusMap.set(d.mds + '||' + d.kedai, d));

      const complete = MASTER_LIST.filter(r =>
        (!areaFilter || r.area === areaFilter) && (!mdsFilter || r.mds === mdsFilter)
      ).filter(r => {
        const d = statusMap.get(r.mds + '||' + r.kedai);
        return d?.peny && d?.disp && (d?.ktp || KTP_EXEMPT.has(r.kedai));
      });

      if(!complete.length){
        const filterLabel = [areaFilter, mdsFilter].filter(Boolean).join(' · ');
        pdfStatus.textContent = `Tidak ada kedai lengkap${filterLabel ? ' untuk ' + filterLabel : ' untuk filter saat ini'}.`;
        setTimeout(() => pdfStatus.textContent = '', 4000);
        return;
      }

      pdfBtn.disabled = true;
      const { jsPDF } = window.jspdf;
      const pdfDoc = new jsPDF({ unit: 'mm', format: 'a4' });
      const pageW = pdfDoc.internal.pageSize.getWidth();
      const pageH = pdfDoc.internal.pageSize.getHeight();
      const margin = 15;
      const contentTop = margin + 16;
      const contentH = pageH - contentTop - margin;
      const halfH = (contentH - 10) / 2;
      const imgW = pageW - margin * 2;

      for(let i = 0; i < complete.length; i++){
        const r = complete[i];
        pdfStatus.textContent = `Mengambil foto ${i + 1} / ${complete.length}…`;
        const docId = reportDocId(r.area, r.mds, r.kedai);
        const snap = await getDoc(doc(reportsRef, docId));
        const d = snap.exists() ? snap.data() : null;
        if(!d) continue;

        if(i > 0) pdfDoc.addPage();
        pdfDoc.setFontSize(14);
        pdfDoc.setTextColor(20);
        pdfDoc.text(r.kedai, margin, margin + 2);
        pdfDoc.setFontSize(10);
        pdfDoc.setTextColor(120);
        pdfDoc.text(`Area: ${r.area}`, margin, margin + 8);
        pdfDoc.setTextColor(20);

        try {
          if(d.foto_ktp){
            const [ktpImg, penyImg, displayImg] = await Promise.all([
              loadImage(d.foto_ktp), loadImage(d.foto_penyerahan), loadImage(d.foto_display)
            ]);
            pdfDoc.setFontSize(9);
            pdfDoc.text('Foto KTP', margin, contentTop);
            drawImageFit(pdfDoc, ktpImg, margin, contentTop + 3, imgW, halfH - 3);

            const secondTop = contentTop + halfH + 8;
            const colGap = 6;
            const colW = (imgW - colGap) / 2;
            pdfDoc.text('Foto Penyerahan', margin, secondTop);
            drawImageFit(pdfDoc, penyImg, margin, secondTop + 3, colW, halfH - 3);
            pdfDoc.text('Foto Display', margin + colW + colGap, secondTop);
            drawImageFit(pdfDoc, displayImg, margin + colW + colGap, secondTop + 3, colW, halfH - 3);
          } else {
            const [penyImg, displayImg] = await Promise.all([
              loadImage(d.foto_penyerahan), loadImage(d.foto_display)
            ]);
            drawImageFit(pdfDoc, penyImg, margin, contentTop, imgW, halfH);
            drawImageFit(pdfDoc, displayImg, margin, contentTop + halfH + 8, imgW, halfH);
          }
        } catch (err) {
          pdfDoc.setFontSize(10);
          pdfDoc.text('Gagal memuat foto untuk kedai ini.', margin, contentTop + 10);
        }
      }

      const fnameParts = ['report-tukar-sachet', areaFilter, mdsFilter].filter(Boolean).map(slugify);
      pdfDoc.save(fnameParts.join('_') + '.pdf');
      const filterLabel = [areaFilter, mdsFilter].filter(Boolean).join(' · ');
      pdfStatus.textContent = `✓ ${complete.length} kedai berhasil diekspor${filterLabel ? ' (' + filterLabel + ')' : ''}.`;
      pdfBtn.disabled = false;
      setTimeout(() => pdfStatus.textContent = '', 5000);
    });
  }
</script>
</body>
</html>
