<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Serbu Pasar Sulawesi — Cari Pasar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0f17; --surface:#121826; --card:#182036; --border:#242e46;
    --text:#e9edf5; --text2:#8d97b3; --text3:#525d78; --accent:#ffb454;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 80px}

  .page-toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:9px;
    padding:3px;gap:3px;margin-bottom:22px}
  .pt-btn{flex:1;text-align:center;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600;
    color:var(--text3);text-decoration:none;transition:background .15s,color .15s}
  .pt-btn:hover{color:var(--text2)}
  .pt-btn.active{background:var(--accent);color:#1a1006}

  h1{font-size:22px;font-weight:700;font-family:Georgia,serif;margin-bottom:4px}
  .sub{font-size:12.5px;color:var(--text3);line-height:1.6;margin-bottom:24px}

  .step{margin-bottom:22px}
  .step-label{display:flex;align-items:center;gap:8px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--text3);font-weight:700;margin-bottom:9px}
  .step-num{width:18px;height:18px;border-radius:50%;background:var(--card);border:1px solid var(--border);
    color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0}

  select,input[type="text"]{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:14px;outline:none;font-family:inherit}
  select:focus,input[type="text"]:focus{border-color:var(--accent)}
  ::placeholder{color:var(--text3)}

  .cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cat{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1px solid var(--border);user-select:none;transition:border-color .15s}
  .cat:hover{border-color:var(--text3)}
  .cat.sel{border-color:currentColor;background:rgba(255,255,255,.04)}
  .cat .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .cat .nm{font-size:12.5px;font-weight:600;color:var(--text);flex:1;line-height:1.25}
  .cat .ct{font-size:12px;font-family:'DM Mono',monospace;color:var(--text3)}
  .cat-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-top:10px}

  .area-sum{display:flex;gap:8px;margin-bottom:10px}
  .area-sum .box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 10px;text-align:center}
  .area-sum .n{font-size:16px;font-weight:700;font-family:'DM Mono',monospace}
  .area-sum .l{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

  .pasar-list{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .pasar-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);
    cursor:pointer;transition:background .12s}
  .pasar-item:last-child{border-bottom:none}
  .pasar-item:hover{background:var(--card)}
  .pasar-item.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
  .pasar-item .p-name{flex:1;font-size:13px;font-weight:500;line-height:1.3}
  .pasar-item .p-kab{display:block;font-size:11px;color:var(--text3);font-weight:400;margin-top:1px}
  .pasar-item .p-omzet{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap}
  .empty{font-size:12.5px;color:var(--text3);padding:20px;text-align:center;line-height:1.6}

  .summary{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
  .summary.show{display:block}
  .s-kab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
  .s-name{font-size:18px;font-weight:700;margin-top:3px;line-height:1.3}
  .s-cat{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;color:#0b0f17}
  .s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .s-box{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px}
  .s-box .l{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .s-box .v{font-size:16px;font-weight:700;font-family:'DM Mono',monospace}
  .s-blitz{width:100%;margin-bottom:10px;padding:10px;border-radius:9px;border:1px solid rgba(255,93,93,.4);
    background:rgba(255,93,93,.1);color:#ff8a8a;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .s-link{display:block;text-align:center;background:var(--accent);color:#1a1006;padding:13px;border-radius:10px;
    font-size:14px;font-weight:700;text-decoration:none}
  .s-link:hover{filter:brightness(1.08)}

  .blitz-overlay{display:none;position:fixed;inset:0;background:rgba(6,9,15,.72);backdrop-filter:blur(3px);
    z-index:100;align-items:center;justify-content:center;padding:24px}
  .blitz-overlay.show{display:flex}
  .blitz-modal{position:relative;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;
    background:linear-gradient(160deg,rgba(255,93,93,.14),rgba(24,32,54,.98) 30%);
    border:1px solid rgba(255,93,93,.4);border-radius:16px;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .blitz-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text2);
    font-size:26px;line-height:1;cursor:pointer;padding:4px}
  .blitz-close:hover{color:var(--text)}
  .blitz-title{font-size:19px;font-weight:700;color:#ff8a8a;margin-bottom:4px;padding-right:24px}
  .blitz-sub{font-size:13px;color:var(--text2);margin-bottom:18px}
  .blitz-rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .blitz-row{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .blitz-row .l{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:3px}
  .blitz-row .v{font-size:15px;color:var(--text);font-weight:700}
  .blitz-insight .l{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:6px;font-weight:700}
  .blitz-insight p{font-size:13.5px;line-height:1.7;color:var(--text2)}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  @media (max-width:420px){ .s-grid{grid-template-columns:1fr 1fr} .cats{grid-template-columns:1fr} }
</style>
</head>

<div class="wrap">
  <div class="page-toggle">

    <div class="empty" id="summaryHint" style="border:1px dashed var(--border);border-radius:10px">Pilih satu pasar di atas untuk melihat ringkasannya.</div>
  </div>
</div>

<div class="blitz-overlay" id="blitzOverlay">

  </div>
</div>

function guessProvinsi(kab){
  const gorontalo = ["Boalemo","Bone Bolango","Gorontalo","Gorontalo Utara","Kota Gorontalo","Pohuwato"];
  const sulbar = ["Majene","Mamasa","Mamuju","Mamuju Tengah","Pasangkayu","Polewali Mandar"];
  const sulteng = ["Banggai","Banggai Kepulauan","Banggai Laut","Buol","Donggala","Morowali","Morowali Utara",
    "Parigi Moutong","Poso","Sigi","Tojo Una-Una","Tojo Una Una","Toli-Toli","Tolitoli","Kota Palu"];
  const sultra = ["Bombana","Buton","Buton Selatan","Buton Tengah","Buton Utara","Kolaka","Kolaka Timur",
    "Kolaka Utara","Konawe","Konawe Selatan","Konawe Utara","Konawe Kepulauan","Muna","Muna Barat","Wakatobi",
    "Kota Kendari","Kota Baubau"];
  const sulut = ["Bolaang Mongondow","Bolaang Mongondow Selatan","Bolaang Mongondow Timur","Bolaang Mongondow Utara",
    "Kepulauan Sangihe","Kep. Siau Tagulandang Biaro","Kepulauan Talaud","Minahasa","Minahasa Selatan",
    "Minahasa Tenggara","Minahasa Utara","Kota Bitung","Kota Kotamobagu","Kota Manado","Kota Tomohon"];
  if(gorontalo.includes(kab)) return "Gorontalo";
  if(sulbar.includes(kab)) return "Sulawesi Barat";
  if(sulteng.includes(kab)) return "Sulawesi Tengah";
  if(sultra.includes(kab)) return "Sulawesi Tenggara";
  if(sulut.includes(kab)) return "Sulawesi Utara";
  return "Sulawesi Selatan";
}
DATA.forEach(d => d.prov = guessProvinsi(d.kab));

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtRp(n){
  if(n >= 1e9) return "Rp " + (n/1e9).toFixed(1) + " M";
  if(n >= 1e6) return "Rp " + (n/1e6).toFixed(1) + " Jt";
  if(n >= 1e3) return "Rp " + (n/1e3).toFixed(0) + " Rb";
  return "Rp " + Math.round(n).toLocaleString('id-ID');
}
function gmapsUrl(d){ return "https://www.google.com/maps/d/viewer?mid=1_8IsynnyWET9ve7EaRRkc9FQMfYlKes&ll=" + d.lat + "%2C" + d.lon + "&z=17"; }

let activeArea = '';
let activeCat = 'Prioritas Tinggi';
let selected = null;
let shown = [];

function inArea(d){ return !activeArea || d.kab === activeArea; }

function buildAreaSelect(){
  const sel = document.getElementById('areaSelect');
  const byProv = {};
  DATA.forEach(d => { (byProv[d.prov] = byProv[d.prov] || new Set()).add(d.kab); });
  const kabCount = new Set(DATA.map(d => d.kab)).size;
  let html = `<option value="">Semua area (${kabCount} kab/kota)</option>`;
  Object.keys(byProv).sort().forEach(p => {
    html += `<optgroup label="${esc(p)}">` +
      [...byProv[p]].sort().map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('') + `</optgroup>`;
  });
  sel.innerHTML = html;
  sel.onchange = () => { activeArea = sel.value; selected = null; renderAll(); };
}

function buildCats(){
  const el = document.getElementById('catList');
  el.innerHTML = Object.keys(CATS).map(cat => {
    const count = DATA.filter(d => d.kategori === cat && inArea(d)).length;
    return `<div class="cat${cat === activeCat ? ' sel' : ''}" data-cat="${esc(cat)}" style="color:${CATS[cat]}">
      <span class="dot" style="background:${CATS[cat]}"></span>
      <span class="nm">${esc(cat)}</span><span class="ct">${count}</span></div>`;
  }).join('');
  el.querySelectorAll('.cat').forEach(c => c.addEventListener('click', () => {
    activeCat = c.dataset.cat; selected = null; renderAll();
  }));
  document.getElementById('catDesc').textContent = CAT_DESC[activeCat];
}

function buildPasarList(){
  const term = document.getElementById('pasarSearch').value.trim().toLowerCase();
  let list = DATA.filter(d => d.kategori === activeCat && inArea(d));

  const toko = list.reduce((s,d) => s + d.toko, 0);
  const op = list.reduce((s,d) => s + d.operator, 0);
  document.getElementById('areaSum').innerHTML =
    `<div class="box"><div class="n">${list.length}</div><div class="l">Pasar</div></div>
     <div class="box"><div class="n">${toko.toLocaleString('id-ID')}</div><div class="l">Toko</div></div>
     <div class="box"><div class="n">${op.toLocaleString('id-ID')}</div><div class="l">Operator</div></div>`;

  if(term) list = list.filter(d => d.pasar.toLowerCase().includes(term) || d.kab.toLowerCase().includes(term));
  list.sort((a,b) => b.omzet_total - a.omzet_total);
  shown = list;

  const wrap = document.getElementById('pasarList');
  if(!list.length){ wrap.innerHTML = `<div class="empty">Tidak ada pasar untuk pilihan ini.</div>`; return; }
  wrap.innerHTML = list.map((d, i) => `
    <div class="pasar-item${selected === d ? ' sel' : ''}" data-i="${i}">
      <span class="p-name">${esc(d.pasar)}${activeArea ? '' : `<span class="p-kab">${esc(d.kab)}</span>`}</span>
      <span class="p-omzet">${d.omzet_total > 0 ? fmtRp(d.omzet_total) : '—'}</span>
    </div>`).join('');
  wrap.querySelectorAll('.pasar-item').forEach(it => it.addEventListener('click', () => {
    selected = shown[parseInt(it.dataset.i)];
    buildPasarList();
    renderSummary(true);
  }));
}

  const box = document.getElementById('summary');
  const hint = document.getElementById('summaryHint');
  if(!selected){ box.classList.remove('show'); hint.style.display = ''; return; }
  const d = selected;
  const blitz = BLITZ[d.kab + '|' + d.pasar];
  hint.style.display = 'none';
  box.innerHTML = `
    <div class="s-kab">${esc(d.kab)} · ${esc(d.prov)}</div>
    <div class="s-name">${esc(d.pasar)}</div>
    <span class="s-cat" style="background:${CATS[d.kategori]}">${esc(d.kategori)}</span>
    <div class="s-grid">
      <div class="s-box"><div class="l">Toko</div><div class="v">${d.toko}</div></div>
      <div class="s-box"><div class="l">Operator</div><div class="v">${d.operator}</div></div>
      <div class="s-box"><div class="l">Omzet</div><div class="v">${d.omzet_total > 0 ? fmtRp(d.omzet_total) : '—'}</div></div>
    </div>
    ${blitz ? `<button type="button" class="s-blitz" id="blitzBtn">🔥 Lihat report Blitz HiLo Matcha</button>` : ''}
    <a class="s-link" href="${gmapsUrl(d)}" target="_blank" rel="noopener">Buka di Google Maps ↗</a>`;
  box.classList.add('show');
  if(blitz) document.getElementById('blitzBtn').addEventListener('click', () => showBlitzModal(d, blitz));
  if(scroll) box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function showBlitzModal(d, blitz){
  document.getElementById('bSub').textContent = d.pasar + ' — ' + d.kab;
  const rows = [
    ['Lokasi', blitz.lokasi], ['Tanggal', blitz.tanggal], ['Personil', blitz.personil],
    ['Omzet Blitz', blitz.omzet != null ? fmtRp(blitz.omzet) : null],
    ['Call', blitz.call], ['EC', blitz.ec], ['EC Matcha', blitz.ec_matcha],
    ['RO Baru', blitz.ro_baru], ['Titik Gagal', blitz.titik_gagal],
    ['Jumlah Pembeli', blitz.jumlah_pembeli], ['Varian Produk', blitz.varian]
  ].filter(([,v]) => v !== null && v !== undefined && v !== '');
  document.getElementById('bRows').innerHTML = rows.map(([l,v]) => `<div class="blitz-row"><span class="l">${l}</span><span class="v">${esc(v)}</span></div>`).join('');
  document.getElementById('bInsight').textContent = blitz.insight;
  document.getElementById('blitzOverlay').classList.add('show');
}
function closeBlitzModal(){ document.getElementById('blitzOverlay').classList.remove('show'); }
document.getElementById('blitzClose').addEventListener('click', closeBlitzModal);
document.getElementById('blitzOverlay').addEventListener('click', e => { if(e.target.id === 'blitzOverlay') closeBlitzModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeBlitzModal(); });

function renderAll(){ buildCats(); buildPasarList(); renderSummary(false); }

buildAreaSelect();
renderAll();
document.getElementById('pasarSearch').addEventListener('input', buildPasarList);
</script>
</body>
</html>
