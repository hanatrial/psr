<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Input Report Tim — Serbu Pasar Sulawesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0f17; --surface:#121826; --card:#182036; --border:#242e46;
    --text:#e9edf5; --text2:#8d97b3; --text3:#525d78;
    --accent:#ffb454; --ok:#4fd1c5; --err:#ff5d5d;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 80px}

  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  h1{font-size:20px;font-weight:700;font-family:Georgia,serif;margin-bottom:6px}
  .sub{font-size:12.5px;color:var(--text3);line-height:1.6;margin-bottom:28px}

  .setup-warning{display:none;background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4);
    border-radius:10px;padding:14px 16px;margin-bottom:24px;font-size:12px;line-height:1.6;color:#ffb4b4}
  .setup-warning.show{display:block}
  .setup-warning code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace}

  form{display:flex;flex-direction:column;gap:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);
    font-weight:600;margin-bottom:6px}
  input,textarea,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:13.5px;outline:none;font-family:'DM Sans',sans-serif}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  ::placeholder{color:var(--text3)}
  input[type="file"]{padding:9px 10px;font-size:12px;color:var(--text2)}

  button.submit{margin-top:8px;padding:13px;border-radius:9px;border:none;background:var(--accent);
    color:#1a1006;font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .15s}
  button.submit:hover{filter:brightness(1.08)}
  button.submit:disabled{opacity:.5;cursor:not-allowed}

  .status{margin-top:14px;font-size:12.5px;padding:10px 12px;border-radius:8px;display:none}
  .status.show{display:block}
  .status.ok{background:rgba(79,209,197,.12);color:var(--ok);border:1px solid rgba(79,209,197,.35)}
  .status.err{background:rgba(255,93,93,.12);color:var(--err);border:1px solid rgba(255,93,93,.35)}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 14px}
  .list-head h2{font-size:14px;font-family:Georgia,serif}
  .list-head .count{font-size:11.5px;color:var(--text3);font-family:'DM Mono',monospace}
  .list-filter{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .list-filter > div{flex:1;min-width:150px}
  .list-filter label{margin:0 0 5px;white-space:nowrap;display:block}
  .list-filter select{width:100%;padding:7px 10px;font-size:12.5px}

  .totals-bar{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;margin-bottom:14px}
  .totals-bar .t{flex:1;background:var(--card);padding:11px 14px}
  .totals-bar .t .n{font-size:17px;font-weight:700;font-family:'DM Mono',monospace}
  .totals-bar .t .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-top:2px}
  .totals-bar .t.ok .n{color:var(--ok)}
  .totals-bar .t.pending .n{color:var(--accent)}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
  table.report-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.report-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text3);padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);
    white-space:nowrap}
  table.report-table td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.report-table tr:last-child td{border-bottom:none}
  table.report-table tr:hover td{background:rgba(255,255,255,.02)}
  .entry-area{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--accent);background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.3);
    border-radius:20px;padding:2px 8px}
  .chk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:6px;font-size:13px;font-weight:700;text-decoration:none}
  .chk.yes{background:rgba(79,209,197,.15);color:var(--ok);border:1px solid rgba(79,209,197,.4)}
  .chk.no{background:rgba(255,93,93,.1);color:var(--err);border:1px solid rgba(255,93,93,.3)}
  .empty-list{font-size:12px;color:var(--text3);text-align:center;padding:24px;white-space:normal}
</style>
</head>
<body>
<div class="wrap">

  </div>

  <form id="reportForm">
    <div>
      <label for="fArea">Area</label>
      <select id="fArea" required>
        <option value="" disabled selected>Pilih area</option>
        <option value="Makassar">Makassar</option>
        <option value="Gorontalo">Gorontalo</option>
      </select>
    </div>

    <div class="row2">
      <div>
        <label for="fMds">Nama MDS</label>
        <select id="fMds" required>
          <option value="" disabled selected>Pilih MDS</option>
        </select>
      </div>
      <div>
        <label for="fKedai">Nama Kedai</label>
        <select id="fKedai" required>
          <option value="" disabled selected>Pilih kedai</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div>
        <label for="fKtp">Foto KTP</label>
        <input type="file" id="fKtp" accept="image/*" capture="environment" required>
      </div>
      <div>
        <label for="fPenyerahan">Foto Penyerahan</label>
        <input type="file" id="fPenyerahan" accept="image/*" capture="environment" required>
      </div>
    </div>

    <button type="submit" class="submit" id="submitBtn">Kirim Report</button>
    <div class="status" id="formStatus"></div>
  </form>

  <div class="list-head">
    <h2>Report Masuk</h2>
    <span class="count" id="entryCount">—</span>
  </div>
  <div class="list-filter">
    <div>
      <label for="filterArea">Filter Area</label>
      <select id="filterArea">
        <option value="">Semua Area</option>
        <option value="Makassar">Makassar</option>
        <option value="Gorontalo">Gorontalo</option>
      </select>
    </div>
    <div>
      <label for="filterMds">Filter MDS</label>
      <select id="filterMds">
        <option value="">Semua MDS</option>
      </select>
    </div>
  </div>
  <div class="totals-bar" id="totalsBar"></div>
  <div class="table-wrap">
    <table class="report-table">
      <thead>
        <tr>
          <th>Nama MDS</th>
          <th>Nama Kedai</th>
          <th>Area</th>
          <th>KTP</th>
          <th>Foto</th>
        </tr>
      </thead>
      <tbody id="entryList"><tr><td colspan="5" class="empty-list">Memuat…</td></tr></tbody>
    </table>
  </div>
</div>

  // =========================================================

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("GANTI");
  const form = document.getElementById('reportForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('formStatus');
  const entryList = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');

  const fArea = document.getElementById('fArea');
  const fMds = document.getElementById('fMds');
  const fKedai = document.getElementById('fKedai');

  function fillSelect(selectEl, items, placeholder){
    selectEl.innerHTML = '';
    const ph = document.createElement('option');
    ph.value = ''; ph.disabled = true; ph.selected = true;
    ph.textContent = items.length ? placeholder : 'Tidak ada data';
    selectEl.appendChild(ph);
    items.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      selectEl.appendChild(opt);
    });
  }
  function uniqueSorted(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b)); }

  // ---- Form: Area -> MDS -> Kedai, semua diturunkan dari MASTER_LIST ----
  function updateMdsForArea(){
    const area = fArea.value;
    const mdsOptions = uniqueSorted(MASTER_LIST.filter(r => r.area === area).map(r => r.mds));
    fillSelect(fMds, mdsOptions, 'Pilih MDS');
    fillSelect(fKedai, [], 'Pilih MDS dulu');
  }
  function updateKedaiForMds(){
    const area = fArea.value, mds = fMds.value;
    const kedaiOptions = uniqueSorted(MASTER_LIST.filter(r => r.area === area && r.mds === mds).map(r => r.kedai));
    fillSelect(fKedai, kedaiOptions, 'Pilih kedai');
  }
  fArea.addEventListener('change', updateMdsForArea);
  fMds.addEventListener('change', updateKedaiForMds);
  fillSelect(fMds, [], 'Pilih Area dulu');
  fillSelect(fKedai, [], 'Pilih MDS dulu');

  // ---- Report Masuk: tampilkan SEMUA kedai di MASTER_LIST, dicocokkan ke report yang sudah masuk ----
  const filterArea = document.getElementById('filterArea');
  const filterMds = document.getElementById('filterMds');
  const totalsBar = document.getElementById('totalsBar');
  let lastDocs = [];

  function updateMdsFilterOptions(){
    const area = filterArea.value;
    const mdsOptions = uniqueSorted(MASTER_LIST.filter(r => !area || r.area === area).map(r => r.mds));
    const current = filterMds.value;
    filterMds.innerHTML = '<option value="">Semua MDS</option>' +
      mdsOptions.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
    if(mdsOptions.includes(current)) filterMds.value = current;
  }

  function renderEntries(){
    const areaFilter = filterArea.value;
    const mdsFilter = filterMds.value;

    const reportMap = new Map();
    lastDocs.forEach(d => reportMap.set(d.mds + '||' + d.kedai, d));

    const rows = MASTER_LIST.filter(r =>
      (!areaFilter || r.area === areaFilter) && (!mdsFilter || r.mds === mdsFilter)
    );

    const withKtp = rows.filter(r => reportMap.get(r.mds + '||' + r.kedai)?.foto_ktp).length;
    const withFoto = rows.filter(r => reportMap.get(r.mds + '||' + r.kedai)?.foto_penyerahan).length;
    const lengkap = rows.filter(r => {
      const d = reportMap.get(r.mds + '||' + r.kedai);
      return d?.foto_ktp && d?.foto_penyerahan;
    }).length;

    entryCount.textContent = rows.length + ' kedai';
    totalsBar.innerHTML = `
      <div class="t"><div class="n">${rows.length}</div><div class="l">Total Kedai</div></div>
      <div class="t"><div class="n">${withKtp}</div><div class="l">KTP Masuk</div></div>
      <div class="t"><div class="n">${withFoto}</div><div class="l">Foto Masuk</div></div>
      <div class="t ok"><div class="n">${lengkap} / ${rows.length}</div><div class="l">Lengkap</div></div>
      <div class="t pending"><div class="n">${rows.length - lengkap}</div><div class="l">Belum Lengkap</div></div>`;

    if(!rows.length){
      entryList.innerHTML = '<tr><td colspan="5" class="empty-list">Tidak ada kedai untuk filter ini.</td></tr>';
      return;
    }
    entryList.innerHTML = rows.map(r => {
      const d = reportMap.get(r.mds + '||' + r.kedai);
      return `
      <tr>
        <td>${escapeHtml(r.mds)}</td>
        <td>${escapeHtml(r.kedai)}</td>
        <td><span class="entry-area">${escapeHtml(r.area)}</span></td>
        <td>${d?.foto_ktp ? `<a class="chk yes" href="${d.foto_ktp}" target="_blank" rel="noopener" title="Lihat foto KTP">✓</a>` : `<span class="chk no">✕</span>`}</td>
        <td>${d?.foto_penyerahan ? `<a class="chk yes" href="${d.foto_penyerahan}" target="_blank" rel="noopener" title="Lihat foto penyerahan">✓</a>` : `<span class="chk no">✕</span>`}</td>
      </tr>`;
    }).join('');
  }
  filterArea.addEventListener('change', () => { updateMdsFilterOptions(); renderEntries(); });
  filterMds.addEventListener('change', renderEntries);
  updateMdsFilterOptions();
  renderEntries();

  if(!isConfigured){
    document.getElementById('setupWarning').classList.add('show');
    submitBtn.disabled = true;
    entryList.innerHTML = '<tr><td colspan="5" class="empty-list">Firebase belum dikonfigurasi.</td></tr>';
  } else {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const reportsRef = collection(db, "reports");

    async function uploadPhoto(file, prefix){
      if(!file) return null;
      const path = `reports/${Date.now()}_${prefix}_${file.name}`;
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, file);
      return await getDownloadURL(fileRef);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Mengirim…';
      statusEl.classList.add('show');
      try {
        const ktpFile = document.getElementById('fKtp').files[0];
        const penyerahanFile = document.getElementById('fPenyerahan').files[0];
        const [ktpUrl, penyerahanUrl] = await Promise.all([
          uploadPhoto(ktpFile, 'ktp'),
          uploadPhoto(penyerahanFile, 'penyerahan')
        ]);

        await addDoc(reportsRef, {
          area: fArea.value,
          mds: fMds.value,
          kedai: fKedai.value,
          foto_ktp: ktpUrl,
          foto_penyerahan: penyerahanUrl,
          created_at: serverTimestamp()
        });
        form.reset();
        statusEl.textContent = '✓ Report berhasil dikirim.';
        statusEl.classList.remove('err'); statusEl.classList.add('ok');
      } catch (err) {
        statusEl.textContent = 'Gagal mengirim: ' + err.message;
        statusEl.classList.remove('ok'); statusEl.classList.add('err');
      } finally {
        submitBtn.disabled = false;
        setTimeout(() => statusEl.classList.remove('show'), 4000);
      }
    });

    const q = query(reportsRef, orderBy('created_at', 'desc'), limit(200));
    onSnapshot(q, (snap) => {
      lastDocs = snap.docs.map(doc => doc.data());
      renderEntries();
    }, (err) => {
      entryList.innerHTML = '<tr><td colspan="5" class="empty-list">Gagal memuat data: ' + escapeHtml(err.message) + '</td></tr>';
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
